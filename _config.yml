# ==================================================
# Site Settings
# ==================================================

title: Jennifer Tesolin
description: "A home for the things I build, explore, and occasionally write about."
url: "https://jenntesolin.com"
baseurl: ""
timezone: America/Toronto
lang: en-CA

# ==================================================
# Author Settings
# ==================================================

author: Jennifer Tesolin
email: me@jenntesolin.com
github_username: jennifert

# ==================================================
# Build Settings
# ==================================================

# Temporary theme until Pico CSS is implemented.
theme: minima

markdown: kramdown
highlighter: rouge

# Preserve the original Jekyll blog URL structure.
permalink: /blog/:year/:month/:day/:title/

# ==================================================
# Plugins
# ==================================================

plugins:
  - jekyll-feed

# ==================================================
# Feed Settings
# ==================================================

feed:
  path: atom.xml

# ==================================================
# Markdown Settings
# ==================================================

kramdown:
  input: GFM
  syntax_highlighter: rouge

# ==================================================
# Front Matter Defaults
# ==================================================

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

  - scope:
      path: ""
      type: pages
    values:
      layout: page

# ==================================================
# Excluded Files and Directories
# ==================================================

exclude:
  - Gemfile
  - Gemfile.lock
  - Rakefile
  - README.md
  - CHANGELOG.md
  - TODO.md
  - project-plan.md
  - LICENSE
  - scripts/
  - test/
  - docs/
  - coverage/
  - vendor/
  - node_modules/
  - .bundle/
  - .idea/
  - .vscode/
  - .github/
